<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Sem internet</title>
    <!-- Página mostrada pelo app instalável (public/sw.js) quando não há internet.
         Tudo embutido aqui: sem internet, não dá para buscar fontes ou estilos de fora. -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #0a0a0b;
        color: #f4f4f5;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 16px;
        background: #fff;
        padding: 4px;
      }
      .mark img { width: 100%; height: 100%; display: block; }
      h1 { margin: 0 0 8px; font-size: 1.6rem; line-height: 1.2; }
      p { margin: 0; color: #a1a1aa; }
      button {
        margin-top: 28px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 10px;
        background: #f97316;
        color: #0a0a0b;
        font: 600 1rem system-ui, -apple-system, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      button:hover { background: #ea6a0f; }
      button:focus-visible { outline: 3px solid #fb923c; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><img src="/icons/icon-192.png" alt="" /></div>
      <h1>Você está sem internet</h1>
      <p>Confira o Wi-Fi ou os dados móveis. Quando a conexão voltar, toque em “Tentar de novo”.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
